<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --border: rgba(255,255,255,0.07);
      --border-mid: rgba(255,255,255,0.14);
      --accent: #3b82f6;
      --accent2: #6366f1;
      --text: #f1f5f9;
      --text-sec: #94a3b8;
      --text-hint: #475569;
      --green: #10b981;
      --red: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      padding: 32px 20px 20px;
      background: linear-gradient(180deg, #0d1528 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    header h1 {
      font-size: 22px; font-weight: 700; letter-spacing: -0.4px;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .subtitle { font-size: 13px; color: var(--text-hint); margin-left: 48px; }

    .income-card {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, #1e3a5f, #1a2a4a);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: var(--radius);
      padding: 20px;
      position: relative; overflow: hidden;
    }

    .income-card::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(99,102,241,0.3), transparent);
      border-radius: 50%;
    }

    .income-label { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }

    .income-wrap { display: flex; align-items: center; gap: 8px; }

    .currency-sym { font-size: 32px; font-weight: 300; color: rgba(255,255,255,0.4); line-height: 1; }

    #income {
      flex: 1; font-size: 42px; font-weight: 700;
      border: none; background: transparent; color: #fff;
      outline: none; width: 100%;
      -webkit-appearance: none; appearance: none;
      letter-spacing: -1px;
    }

    #income::placeholder { color: rgba(255,255,255,0.2); }

    .section { margin: 0 16px 20px; }

    .section-label { font-size: 11px; font-weight: 600; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 4px 10px; }

    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }

    .account-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .account-row:last-of-type { border-bottom: none; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }

    .name-input { flex: 1; font-size: 15px; font-weight: 500; background: transparent; border: none; color: var(--text); outline: none; min-width: 0; }

    .val-input {
      width: 70px; text-align: right; font-size: 15px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm); color: var(--text); padding: 6px 10px;
      -webkit-appearance: none; appearance: none; outline: none;
    }

    .toggle-btn {
      font-size: 12px; font-weight: 700;
      background: var(--surface2); border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm); padding: 6px 10px;
      color: var(--accent); cursor: pointer; min-width: 38px; text-align: center;
    }

    .del-btn { background: none; border: none; color: var(--text-hint); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .del-btn:hover { color: var(--red); }

    .add-btn {
      width: 100%; margin-top: 10px;
      background: transparent; border: 1px dashed var(--border-mid);
      border-radius: var(--radius-sm); padding: 11px;
      font-size: 14px; font-weight: 500; color: var(--text-sec); cursor: pointer;
    }
    .add-btn:hover { background: var(--surface2); }

    .result-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .result-row:last-child { border-bottom: none; }
    .result-label { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text-sec); }
    .result-amount { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }

    .remainder-section { margin: 0 16px 20px; }

    .remainder-card {
      background: linear-gradient(135deg, #064e3b, #065f46);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: var(--radius); padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .remainder-card.negative { background: linear-gradient(135deg, #450a0a, #5a1a1a); border-color: rgba(239,68,68,0.3); }

    .remainder-title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
    .remainder-name { font-size: 17px; font-weight: 600; color: #fff; }
    .remainder-amount { font-size: 28px; font-weight: 800; color: var(--green); letter-spacing: -1px; }
    .remainder-amount.negative { color: var(--red); }

    .warning { font-size: 13px; color: var(--red); margin: 8px 4px 0; display: none; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo">💰</div>
      <h1>Income Splitter</h1>
    </div>
    <p class="subtitle">Allocate your income automatically</p>
  </header>

  <div class="income-card">
    <p class="income-label">Income received</p>
    <div class="income-wrap">
      <span class="currency-sym">$</span>
      <input type="number" id="income" inputmode="decimal" placeholder="0.00" oninput="render()" />
    </div>
  </div>

  <div class="section">
    <p class="section-label">Accounts</p>
    <div class="card">
      <div id="accounts-list"></div>
    </div>
    <button class="add-btn" onclick="addAccount()">+ Add account</button>
  </div>

  <div class="section">
    <p class="section-label">Breakdown</p>
    <div class="card" id="breakdown"></div>
    <p class="warning" id="warning">⚠ Allocations exceed income — please reduce values.</p>
  </div>

  <div class="remainder-section">
    <p class="section-label">Remainder</p>
    <div class="remainder-card" id="remainder-card">
      <div>
        <p class="remainder-title">Personal account</p>
        <p class="remainder-name">Personal</p>
      </div>
      <span class="remainder-amount" id="remainder-amount">$0.00</span>
    </div>
  </div>

  <script>
    const COLORS = ['#3b82f6','#a855f7','#f59e0b','#ec4899','#06b6d4','#f97316','#84cc16','#ef4444'];
    const DEFAULT = [
      { id: 1, name: 'Tax', mode: 'pct', value: 25 },
      { id: 2, name: 'Bills', mode: 'pct', value: 30 },
    ];
    let accounts = JSON.parse(JSON.stringify(DEFAULT));
    let nextId = 3;

    function color(i) { return COLORS[i % COLORS.length]; }

    function addAccount() {
      accounts.push({ id: nextId++, name: 'New account', mode: 'pct', value: 0 });
      render();
      setTimeout(() => {
        const inputs = document.querySelectorAll('.name-input');
        if (inputs.length) { inputs[inputs.length-1].focus(); inputs[inputs.length-1].select(); }
      }, 50);
    }

    function delAccount(id) { accounts = accounts.filter(a => a.id !== id); render(); }

    function toggleMode(id) {
      const income = parseFloat(document.getElementById('income').value) || 0;
      const a = accounts.find(a => a.id === id);
      if (a.mode === 'pct') { a.mode = 'fixed'; a.value = parseFloat((income * a.value / 100).toFixed(2)); }
      else { a.mode = 'pct'; a.value = income > 0 ? parseFloat((a.value / income * 100).toFixed(2)) : 0; }
      render();
    }

    function updateVal(id, v) { const a = accounts.find(a => a.id === id); if (a) a.value = parseFloat(v)||0; calcBreakdown(); }
    function updateName(id, v) { const a = accounts.find(a => a.id === id); if (a) a.name = v; calcBreakdown(); }

    function fmt(n) { return '$' + Math.max(0,n).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function calcBreakdown() {
      const income = parseFloat(document.getElementById('income').value) || 0;
      let allocated = 0;
      const results = accounts.map((a, i) => {
        const amt = a.mode === 'pct' ? income * a.value / 100 : a.value;
        allocated += amt;
        return { name: a.name, amt, color: color(i) };
      });
      const remainder = income - allocated;
      const over = allocated > income + 0.001;
      document.getElementById('warning').style.display = over ? 'block' : 'none';
      document.getElementById('breakdown').innerHTML = results.map(r => `
        <div class="result-row">
          <div class="result-label"><div class="dot" style="background:${r.color};color:${r.color}"></div>${r.name}</div>
          <span class="result-amount" style="color:${r.color}">${fmt(r.amt)}</span>
        </div>`).join('');
      const rc = document.getElementById('remainder-card');
      const ra = document.getElementById('remainder-amount');
      rc.className = 'remainder-card' + (remainder < -0.001 ? ' negative' : '');
      ra.className = 'remainder-amount' + (remainder < -0.001 ? ' negative' : '');
      ra.textContent = fmt(remainder);
    }

    function render() {
      document.getElementById('accounts-list').innerHTML = accounts.map((a, i) => `
        <div class="account-row">
          <div class="dot" style="background:${color(i)};color:${color(i)}"></div>
          <input class="name-input" value="${a.name}" onchange="updateName(${a.id},this.value)" oninput="updateName(${a.id},this.value)" />
          <input type="number" class="val-input" value="${a.value}" min="0" step="${a.mode==='pct'?'0.1':'1'}" inputmode="decimal" onchange="updateVal(${a.id},this.value)" oninput="updateVal(${a.id},this.value)" />
          <button class="toggle-btn" onclick="toggleMode(${a.id})">${a.mode==='pct'?'%':'$'}</button>
          <button class="del-btn" onclick="delAccount(${a.id})">×</button>
        </div>`).join('');
      calcBreakdown();
    }

    render();
  </script>
</body>
</html>
